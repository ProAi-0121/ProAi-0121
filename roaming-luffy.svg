<svg xmlns="http://w3.org" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <style>
      @keyframes walkAround {
        0% { transform: translate(0px, 100px) scaleX(1); }
        45% { transform: translate(720px, 100px) scaleX(1); }
        50% { transform: translate(720px, 100px) scaleX(-1); } /* Flips in place */
        95% { transform: translate(0px, 100px) scaleX(-1); }
        100% { transform: translate(0px, 100px) scaleX(1); }    /* Flips back to start */
      }
      .character {
        animation: walkAround 15s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Clean, transparent pixel Luffy sprite -->
  <image class="character" href="https://media.tenor.com/Du4DUU1_wGUAAAAi/one-piece-pixel.gif" height="80" width="80" />
</svg>
